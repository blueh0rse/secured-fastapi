[project]
name = "secured-fastapi"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "uvloop==0.22.1",
    "psycopg2-binary==2.9.12",
    "PyJWT==2.13.0",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "flake8==7.3.0",
    "pre-commit==4.6.2",
    "bandit[sarif]==1.9.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
