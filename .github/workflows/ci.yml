name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # equal to TRIVY_VERSION in the Makefile
  TRIVY_VERSION: 'v0.74.0'

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vuln-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      # code scan should include dev deps
      TRIVY_INCLUDE_DEV_DEPS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan dependencies (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: 'fs'
          scanners: 'vuln'
          ignore-unfixed: false
          format: 'sarif'
          output: 'trivy-code-results.sarif'
      - name: Upload dependency findings
        # always(), but only when the scan actually produced a file
        if: always() && hashFiles('trivy-code-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: 'trivy-code-results.sarif'
          category: 'trivy-fs'
      - name: Gate on fixable HIGH and CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: 'fs'
          scanners: 'vuln'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

  db-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the pinned database image
        id: dbimg
        run: echo "ref=$(grep -oE 'postgres@sha256:[a-f0-9]+' docker-compose.yml)" >> "$GITHUB_OUTPUT"

      - name: Scan the database image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ steps.dbimg.outputs.ref }}
          scanners: 'vuln'
          vuln-type: 'os,library'
          ignore-unfixed: false
          format: 'sarif'
          output: 'trivy-db-results.sarif'

      - name: Upload database image findings
        if: always() && hashFiles('trivy-db-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: 'trivy-db-results.sarif'
          category: 'trivy-db-image'

  sast-bandit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyCQA/bandit-action@67a458d90fa11fb1463e91e7f4c8f068b5863c7f # v1.0.1
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Gate on MEDIUM findings or higher
        run: make bandit-gate

  sast-semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make semgrep-sarif
      - name: Upload Semgrep findings
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: 'semgrep-results.sarif'
          category: 'semgrep'
      - name: Gate on MEDIUM findings or higher
        run: make semgrep-gate

  lint:
    runs-on: ubuntu-24.04
    needs: [secret-scan, vuln-scan]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: make lint

  test:
    runs-on: ubuntu-24.04
    needs: [secret-scan, vuln-scan]
    timeout-minutes: 10
    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_URL: ${{ secrets.DB_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
      SEED_PASSWORD_ADMIN: ${{ secrets.SEED_PASSWORD_ADMIN }}
      SEED_PASSWORD_ALICE: ${{ secrets.SEED_PASSWORD_ALICE }}
      SEED_PASSWORD_BOB: ${{ secrets.SEED_PASSWORD_BOB }}
      SEED_PASSWORD_CAROL: ${{ secrets.SEED_PASSWORD_CAROL }}
      SEED_PASSWORD_DAVE: ${{ secrets.SEED_PASSWORD_DAVE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: make db
      - run: |
          until docker compose exec db pg_isready -U postgres; do
            echo "Waiting for the database to be ready..."
            sleep 5
          done
      - run: make tests

  # Builds the image once, scans that exact image, then starts it with
  # --no-build so the gate approves what the smoke test runs.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [lint, test]
    permissions:
      contents: read
      security-events: write
    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_URL: ${{ secrets.DB_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
      SEED_PASSWORD_ADMIN: ${{ secrets.SEED_PASSWORD_ADMIN }}
      SEED_PASSWORD_ALICE: ${{ secrets.SEED_PASSWORD_ALICE }}
      SEED_PASSWORD_BOB: ${{ secrets.SEED_PASSWORD_BOB }}
      SEED_PASSWORD_CAROL: ${{ secrets.SEED_PASSWORD_CAROL }}
      SEED_PASSWORD_DAVE: ${{ secrets.SEED_PASSWORD_DAVE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the application image
        run: make image-build

      - name: Scan the image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: 'secured-api:local'
          scanners: 'vuln'
          vuln-type: 'os,library'
          ignore-unfixed: false
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload image findings
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

      - name: Gate on fixable HIGH and CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: 'secured-api:local'
          scanners: 'vuln'
          vuln-type: 'os,library'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

      - name: Start the stack
        run: make up-prebuilt

      - name: Wait for the application to be ready
        run: |
          until curl -sf localhost:8000/health; do
            echo "Waiting for the application to be ready..."
            sleep 5
          done
