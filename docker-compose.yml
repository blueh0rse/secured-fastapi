services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      SEED_PASSWORD_ADMIN: ${SEED_PASSWORD_ADMIN}
      SEED_PASSWORD_ALICE: ${SEED_PASSWORD_ALICE}
      SEED_PASSWORD_BOB: ${SEED_PASSWORD_BOB}
      SEED_PASSWORD_CAROL: ${SEED_PASSWORD_CAROL}
      SEED_PASSWORD_DAVE: ${SEED_PASSWORD_DAVE}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      - db
