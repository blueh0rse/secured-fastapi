services:
  db:
    # Pinned by digest, the same rule the application base image follows.
    # Tag: postgres:18.6-alpine3.24
    image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      SEED_PASSWORD_ADMIN: ${SEED_PASSWORD_ADMIN}
      SEED_PASSWORD_ALICE: ${SEED_PASSWORD_ALICE}
      SEED_PASSWORD_BOB: ${SEED_PASSWORD_BOB}
      SEED_PASSWORD_CAROL: ${SEED_PASSWORD_CAROL}
      SEED_PASSWORD_DAVE: ${SEED_PASSWORD_DAVE}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh
  app:
    build: .
    # Named so the image can be built once, scanned, then started with
    # `docker compose up --no-build`. The gate then approves the exact
    # image the smoke test runs.
    image: secured-api:local
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      - db
